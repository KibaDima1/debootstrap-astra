name: Release Debian package and APT repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build and repository dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts equivs apt-utils
          sudo mk-build-deps --install --remove --tool "apt-get -y --no-install-recommends" debian/control

      - name: Build package
        run: ./scripts/build.sh

      - name: Check tag version
        if: github.event_name == 'push'
        run: |
          package_version=$(dpkg-deb -f dist/debootstrap_*_all.deb Version)
          expected_tag="v${package_version/+/-}"
          test "${GITHUB_REF_NAME}" = "$expected_tag" || {
            echo "Tag must be $expected_tag, got ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes --verify-tag
          fi

      - name: Collect released packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets public
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
              gh release download "$tag" --pattern 'debootstrap_*.deb' --dir release-assets --clobber
            done
          else
            cp dist/*.deb release-assets/
          fi
          ./scripts/create-apt-repo.sh release-assets public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
